- name: Delete all DynaKubes in dynatrace namespace
  ansible.builtin.shell: >
    kubectl delete dynakube -n dynatrace --all
  args:
    executable: /bin/bash
  register: delete_dynakube
  changed_when: "'deleted' in (delete_dynakube.stdout | lower) or 'deleted' in (delete_dynakube.stderr | lower)"
  failed_when: false

# 2) Wait for operator-managed pods to be deleted (official label)
- name: Wait for Dynatrace operator-managed pods to be deleted
  ansible.builtin.shell: >
    kubectl -n dynatrace wait pod
    --for=delete -l app.kubernetes.io/managed-by=dynatrace-operator
    --timeout=300s
  args:
    executable: /bin/bash
  register: wait_pods
  changed_when: false
  failed_when: false

# 2) Delete operator + CSI manifests (THIS is what you're missing)
- name: Delete Dynatrace Operator manifest
  ansible.builtin.shell: >
    kubectl delete -f https://github.com/Dynatrace/dynatrace-operator/releases/download/v1.7.2/kubernetes.yaml
  args:
    executable: /bin/bash
  failed_when: false

- name: Delete Dynatrace CSI manifest
  ansible.builtin.shell: >
    kubectl delete -f https://github.com/Dynatrace/dynatrace-operator/releases/download/v1.7.2/kubernetes-csi.yaml
  args:
    executable: /bin/bash
  failed_when: false

# 3) (Optional) Delete the namespace to wipe remaining secrets/configs
- name: Delete dynatrace namespace
  ansible.builtin.shell: >
    kubectl delete namespace dynatrace
  args:
    executable: /bin/bash
  failed_when: false

- include_role:
    name: dt-operator
  vars:
    operator_mode: "cloudNativeFullStack"
    dt_operator_release: "v1.7.2"
    host_group: k8s_multi_prod

- name: Restart all deployments in easytrade namespace
  ansible.builtin.shell: |
    for d in $(kubectl -n easytrade get deploy -o name); do
      kubectl -n easytrade rollout restart "$d"
    done
  args:
    executable: /bin/bash

- name: Get DynaKube metadataEnrichment status
  ansible.builtin.shell: >
    kubectl get dynakube dynakube -n dynatrace
    -o jsonpath='{.status.metadataEnrichment}'
  args:
    executable: /bin/bash
  register: dynakube_metadata_enrichment
  changed_when: false
  failed_when: false

- name: Show metadataEnrichment status
  ansible.builtin.debug:
    msg: "{{ dynakube_metadata_enrichment.stdout }}"