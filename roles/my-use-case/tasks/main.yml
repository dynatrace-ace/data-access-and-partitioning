---
- include_role:
    name: dt-access-token
  vars:
    access_token_var_name: "DT_TOKEN_monaco"
    access_token_scope: ["DataExport", "InstallerDownload", "activeGateTokenManagement.create", "entities.read", "settings.read", "settings.write", "ReadConfig", "WriteConfig", "syntheticLocations.read"]

- include_role:
    name: monaco-v2
  vars:
    monaco_version: "v2.28.0"

- name: Get public IP address
  command: curl -s http://ifconfig.me/ip
  register: public_ip_result

- name: Set DOMAIN fact
  set_fact:
    domain: "{{ public_ip_result.stdout | trim }}"

