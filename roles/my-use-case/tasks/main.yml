---
- set_fact:
    redeploy: "{{ (lookup('env', 'ACE_ACTION') | default('') | lower) == 'redeploy' }}"

- block:
    - include_role:
        name: dt-access-token
      vars:
        access_token_var_name: "DT_TOKEN"
        access_token_scope:
          - DataExport
          - InstallerDownload
          - activeGateTokenManagement.create
          - entities.read
          - settings.read
          - settings.write
          - ReadConfig
          - WriteConfig

    - include_role:
        name: monaco-v2
      vars:
        monaco_version: "v2.25.1"

    - name: Monaco - Deploy configuration
      include_role:
        name: monaco-v2
        tasks_from: apply-monaco
      vars:
        monaco_manifest_path: "/home/$USER/repos/data-access-and-partitioning/roles/my-use-case/files/monaco/main/manifest.yaml"
        monaco_environment:
          DT_PLATFORM_TENANT_URL: "{{ extra_vars.dt_environment_url_gen3 | default('', true) | regex_replace('/+$','') }}"
          DT_CLASSIC_TENANT_URL: "{{ extra_vars.dt_environment_url_gen3 | regex_replace('\\.apps\\.', '.') | regex_replace('/+$','') }}"
          DT_OAUTH_CLIENT_ID: "{{ extra_vars.dt_oauth_client_id }}"
          DT_OAUTH_CLIENT_SECRET: "{{ extra_vars.dt_oauth_client_secret }}"
          DT_OAUTH_SSO_ENDPOINT: "{{ extra_vars.dt_oauth_sso_endpoint.rstrip('/') }}"
          DT_TOKEN: "{{ DT_TOKEN }}"

    - include_role:
        name: k3s

    - include_role:
        name: dt-operator
      vars:
        operator_mode: "cloudNativeFullStack"
        dt_operator_release: "v1.7.2"
        host_group: k8s_multi_prod

    - include_role:
        name: app-easytrade

    - include_role:
        name: dt-access-token
      vars:
        access_token_var_name: "dt_operator_dt_access_token_name"
        access_token_scope:
          - DataExport
          - InstallerDownload
          - activeGateTokenManagement.create
          - entities.read
          - settings.read
          - settings.write
          - ReadConfig
          - WriteConfig

    - name: Configure tenant setting new k8s app
      shell: >
        curl -X POST
        '{{ dynatrace_tenant_url }}/api/v2/settings/objects?validateOnly=false'
        -H 'accept: application/json'
        -H 'Content-Type: application/json; charset=utf-8'
        -H 'Authorization: Api-Token {{ dt_operator_dt_access_token_name }}'
        -d '[
              {
                "schemaId": "builtin:app-transition.kubernetes",
                "scope": "environment",
                "value": {
                  "kubernetesAppOptions": {
                    "enableKubernetesApp": true
                  }
                }
              }
            ]'

    - include_role:
        name: dashboard
  when: not redeploy

- name: Redeploy only
  import_tasks: redeploy.yml
  when: redeploy
