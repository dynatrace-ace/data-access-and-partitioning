manifestVersion: 1.0
projects:
  - name: document-notebook
  - name: application
  - name: bizevents-processing-rules
  - name: bizevents
  - name: custom-service
  - name: config
    path: config
    type: grouping
  # - name: auto-tags
  # - name: bucket
  # - name: builtinopenpipeline.spans.pipelines
  # - name: management-zone
  # - name: k8s-telemetry-enrichment
environmentGroups:
  - name: development
    environments:
      - name: dev
        url:
          type: environment
          value: DT_PLATFORM_TENANT_URL 
        auth:
          token:
            type: environment
            name: DT_TOKEN
          oAuth:
            clientId:
              type: environment
              name: DT_OAUTH_CLIENT_ID
            clientSecret:
              type: environment
              name: DT_OAUTH_CLIENT_SECRET
            tokenEndpoint:
              type: environment
              value: DT_OAUTH_SSO_ENDPOINT