apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/common

# Strategic merge patches for annotations (one per deployment)
patches:
  - target:
      kind: Deployment
      name: accountservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: accountservice
      spec:
        template:
          metadata:
            annotations:
              metadata.dynatrace.com/dt.cost.costcenter: "ecommerce-apps"
              metadata.dynatrace.com/dt.cost.product: "accountservice"
              metadata.dynatrace.com/dt.security_context: "accountservice"
  
